name: Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/168465937100/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: github-actions@project-69e911b5-b97a-4392-a32.iam.gserviceaccount.com
      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: asia-northeast1-docker.pkg.dev/project-69e911b5-b97a-4392-a32/k8s-incident-assistant/k8s-incident-assistant:latest
          
